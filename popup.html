<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잡코리아 이력서 갱신</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-popup">
    <span class="close-btn">&times;</span> <!-- 닫기 버튼 -->
    <h2>잡코리아 이력서 갱신</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="id">아이디</label>
            <input type="text" id="id" class="form-control" placeholder="아이디 입력">
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" class="form-control" placeholder="비밀번호 입력">
        </div>
        <button type="submit" class="btn btn-primary">
            <span class="button-text">로그인</span>
            <div class="loading-spinner"></div> <!-- 로딩바 추가 -->
        </button>
    </form>
    <div id="messageBox" class="message-box"></div>
    <div id="errorMessage" class="error-message-box"></div>
    <hr>
    <div class="info-container">
        <ul class="info-list">
            <li class="info-item">
                <svg class="info-icon info-icon-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                </svg>
                <span>확장 프로그램 활성화 중 <strong>잡코리아 이력서</strong>가 자동 갱신됩니다. <strong>(30분 단위)</strong></span>
            </li>
            <li class="info-item">
                <svg class="info-icon info-icon-danger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <rect x="9" y="9" width="6" height="6"/>
                </svg>
                <span><strong>동기화 중지</strong> 버튼을 누르면 자동 갱신이 해제됩니다.</span>
            </li>
            <li class="info-item">
                <svg class="info-icon info-icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span>요청 처리 시 최대 약 <strong>30초</strong> 소요됩니다.</span>
            </li>
            <li class="info-item">
                <svg class="info-icon info-icon-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span>계정 정보는 저장되지 않는 <strong>휘발성 데이터</strong>입니다.</span>
            </li>
        </ul>
        <div class="info-notice">
            <svg class="info-icon info-icon-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span><strong>개인 서버 자원</strong>으로 운영되어 다소 지연될 수 있습니다.</span>
        </div>
    </div>
</div>

<script src="popup.js"></script>
</body>
</html>
