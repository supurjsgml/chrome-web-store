<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잡코리아 이력서 갱신</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-popup">
    <span class="close-btn">&times;</span> <!-- 닫기 버튼 -->
    <h2>잡코리아 이력서 갱신</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="id">아이디</label>
            <input type="text" id="id" class="form-control" placeholder="아이디 입력">
        </div>
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" class="form-control" placeholder="비밀번호 입력">
        </div>
        <button type="submit" class="btn btn-primary">
            <span class="button-text">로그인</span>
            <div class="loading-spinner"></div> <!-- 로딩바 추가 -->
        </button>
    </form>
    <div id="messageBox" class="message-box"></div>
    <div id="errorMessage" class="error-message-box"></div>
    <hr>
    <div class="info-container">
        <p class="info-text">
            🔄 확장 프로그램이 활성화 되어 있는 동안 <strong>잡코리아 이력서가</strong> 자동 갱신됩니다. <strong>(30분 단위)</strong>
        </p>
        <p class="info-text">
            🔄 <strong>동기화 중지</strong> 버튼을 누르면 자동갱신이 해제 됩니다.
        </p>
        <p class="info-text">
            ⏳ 최대 약 <strong>30초</strong> 소요됩니다.
        </p>
        <p class="info-text">
            🔐 아이디/비밀번호는 휘발성입니다. <strong>(저장하지 않음)</strong> 안심하세요.
        </p>
        <p class="info-text">
            ⚠️ <strong>가난한 서버 스펙</strong>으로 운영되고 있습니다. 😢
        </p>
        <!-- <p class="info-text">
            💡 베타버전 입니다. 추후 시간이 남아 돈다면 사용자가 직접 갱신 시간 설정 가능하게 업데이트 예정입니다.
        </p> -->
    </div>
</div>

<script src="popup.js"></script>
</body>
</html>
